<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 <h1>Tic Tac Toe</h1>
<p id="message"></p>
<div id="board"></div>

<div id="controls">
  <button id="restart">New Game</button>
  <button id="changeNames">Change Names</button>
</div>

<div id="names" hidden>
  <input type="text" id="name1" placeholder="Player 1 name (X)" />
  <input type="text" id="name2" placeholder="Player 2 name (O)" />
  <button id="setNames">Set Names</button>
</div>

<script src="script.js"></script>
</body>
</html>
